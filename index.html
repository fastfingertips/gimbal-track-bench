<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Camera Tracking Test Suite</title>
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <header class="control-panel">
      <!-- Top Row: Title, Mode Selector, Description -->
      <div class="panel-row-top">
        <div class="brand">
          <span class="status-indicator"></span>
          <h1>AI Camera Tracking Test Suite</h1>
        </div>

        <div class="control-item mode-select-box">
          <label for="modeSelect">Active Test Mode</label>
          <select id="modeSelect" class="custom-select" aria-label="Select Test Mode"></select>
        </div>

        <p id="modeDescription" class="mode-description"></p>
      </div>

      <!-- Bottom Row: Global Playback Controls + Dynamic Mode Specific Controls -->
      <div class="controls-group">
        <!-- Global Controls -->
        <button id="togglePlayBtn" class="btn btn-primary" type="button" aria-label="Toggle playback">
          <span class="btn-icon" id="toggleIcon">⏸</span>
          <span class="btn-label" id="toggleText">Pause</span>
        </button>

        <div class="control-item">
          <label for="speedSlider">
            Global Speed: <span id="speedValue" class="badge">1.0x</span>
          </label>
          <input id="speedSlider" type="range" min="0.2" max="4.0" step="0.1" value="1.0" />
        </div>

        <div class="divider"></div>

        <!-- Dynamic controls injected by active mode -->
        <div id="modeSpecificControls" class="controls-group"></div>
      </div>
    </header>

    <main id="canvas-container" class="canvas-container"></main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
