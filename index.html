<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Camera Tracking Test Suite</title>
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <!-- Full-screen canvas container for PTZ / Gimbal camera tracking -->
    <main id="canvas-container" class="canvas-container"></main>

    <!-- Top-Left: Modern Soft Dropdown / Menu for Test Modes -->
    <div id="modeMenuWrapper" class="mode-menu-wrapper">
      <button id="modeDropdownBtn" class="mode-dropdown-trigger" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="trigger-label">Mode</span>
        <span id="triggerActiveName" class="trigger-active-name">Linear Occlusion</span>
        <svg class="chevron-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      <!-- Soft Floating Modes List -->
      <div id="modeDropdownList" class="mode-dropdown-list hidden" role="menu"></div>
    </div>

    <!-- Top-Center: Minimal Clean Text with Sleek Underline Indicator -->
    <div class="active-mode-display">
      <span id="activeModeTitle" class="active-mode-title">Linear Occlusion</span>
      <div class="active-mode-line"></div>
    </div>

    <!-- On-Canvas Click Inspector / Quick Property Tuning HUD -->
    <div id="canvasInspector" class="canvas-inspector hidden">
      <div class="inspector-header">
        <div class="inspector-title-wrap">
          <span class="inspector-badge">PAUSED</span>
          <span id="inspectorTitle" class="inspector-title">Target Properties</span>
        </div>
        <button id="closeInspectorBtn" class="inspector-close-btn" type="button" title="Resume Playback (Space/Esc)">✕</button>
      </div>
      <div id="inspectorBody" class="inspector-body"></div>
      <div class="inspector-footer">Click canvas again or press Space to resume</div>
    </div>

    <!-- Top-Right: Isolated GUI Wrapper for Parameter Controls -->
    <div id="gui-container" class="gui-wrapper"></div>

    <!-- Top-Right: 100% Frameless & Non-Boxy Floating Toggle Icon Button -->
    <button
      id="toggleMenuBtn"
      class="icon-btn menu-toggle-btn active"
      type="button"
      title="Toggle Controls Panel (Hotkey: H)"
      aria-label="Toggle Controls Panel"
    >
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>

    <!-- Bottom-Right Borderless GitHub Badge (Text on Left, Fixed Icon on Right) -->
    <a
      href="https://github.com/fastfingertips/gimbal-test"
      target="_blank"
      rel="noopener noreferrer"
      class="ghost-github-badge"
      aria-label="GitHub Repository"
    >
      <span class="repo-text">fastfingertips/gimbal-test</span>
      <svg class="github-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
      </svg>
    </a>

    <!-- TypeScript Entry Point -->
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
