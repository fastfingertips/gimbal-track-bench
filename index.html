<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Camera Tracking Test Tool</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="control-panel">
      <div class="brand">
        <span class="status-indicator"></span>
        <h1>AI Camera Tracking Test Tool</h1>
      </div>

      <div class="controls-group">
        <button id="togglePlayBtn" class="btn btn-primary" type="button" aria-label="Toggle animation playback">
          <span class="btn-icon" id="toggleIcon">⏸</span>
          <span class="btn-label" id="toggleText">Pause</span>
        </button>

        <div class="control-item">
          <label for="speedSlider">
            Speed: <span id="speedValue" class="badge">1.0x</span>
          </label>
          <input
            id="speedSlider"
            type="range"
            min="0.5"
            max="4.0"
            step="0.1"
            value="1.0"
          />
        </div>

        <div class="control-item">
          <label for="obstacleWidthSlider">
            Obstacle Width: <span id="obstacleWidthValue" class="badge">300px</span>
          </label>
          <input
            id="obstacleWidthSlider"
            type="range"
            min="50"
            max="800"
            step="10"
            value="300"
          />
        </div>
      </div>
    </header>

    <main id="canvas-container" class="canvas-container"></main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
