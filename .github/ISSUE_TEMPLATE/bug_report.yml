name: Bug Report
description: Create a report to help us fix a bug or unexpected behavior.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of what the bug is.
    validations:
      required: true
  - type: input
    id: reproduction-url
    attributes:
      label: Reproduction URL
      description: Share URL copied using the 'Copy Share Link' button.
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
